<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - StoryVerse</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        📚 StoryVerse
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="publish.html">Publish</a>
    </nav>

</header>


<main>

<section class="auth-box">

    <h1>Welcome Back</h1>

    <p>Log in to your StoryVerse account.</p>


    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="loginEmail"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p id="loginMessage"></p>


    <p class="auth-switch">

        Don't have an account?

        <a href="register.html">
            Create one
        </a>

    </p>

</section>

</main>


<script type="module" src="auth.js"></script>

</body>

</html>
