<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - StoryVerse</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        📚 StoryVerse
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<main>

<section class="auth-box">

    <h1>Create Account</h1>

    <p>
        Join StoryVerse and start publishing.
    </p>


    <form id="registerForm">

        <label>Username</label>

        <input
            type="text"
            id="registerUsername"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="registerEmail"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="registerPassword"
            minlength="6"
            required
        >


        <button type="submit">
            Create Account
        </button>

    </form>


    <p id="registerMessage"></p>


    <p class="auth-switch">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</section>

</main>


<script
    type="module"
    src="auth.js"
></script>

</body>

</html>
