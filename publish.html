<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Publish Story - StoryVerse</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        📚 StoryVerse
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

    </nav>

</header>


<main>

<section class="publish">

    <h1>Publish Your Story</h1>

    <p>
        Share your imagination with readers around the world.
    </p>


    <form onsubmit="publishStory(event)">

        <label>
            Story Title
        </label>

        <input
            type="text"
            id="publishTitle"
            placeholder="Enter your story title"
            required
        >


        <label>
            Author Name
        </label>

        <input
            type="text"
            id="publishAuthor"
            placeholder="Your name"
            required
        >


        <label>
            Genre
        </label>

        <select id="publishGenre">

            <option>Fantasy</option>
            <option>Action</option>
            <option>Adventure</option>
            <option>Mystery</option>
            <option>Romance</option>

        </select>


        <label>
            Story Description
        </label>

        <textarea
            id="publishDescription"
            placeholder="Tell readers what your story is about..."
            required
        ></textarea>


        <label>
            First Chapter
        </label>

        <textarea
            id="publishContent"
            placeholder="Write your first chapter..."
            required
        ></textarea>


        <button type="submit">
            Publish Story
        </button>

    </form>

</section>

</main>


<script src="script.js"></script>

</body>

</html>
