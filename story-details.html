<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Story - StoryVerse</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        📚 StoryVerse
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="publish.html">
            Publish
        </a>

    </nav>

</header>


<main>

<section class="story-details">

    <div
        id="detailsCover"
        class="details-cover"
    >
        📖
    </div>


    <div class="details-info">

        <p
            id="detailsGenre"
            class="story-category"
        ></p>


        <h1 id="detailsTitle">
            Loading...
        </h1>


        <p id="detailsAuthor"></p>


        <p id="detailsDescription"></p>


        <div class="story-stats">

            <span>
                📚
                <b id="chapterCount">0</b>
                Chapters
            </span>

            <span>
                ⭐
                <b id="storyRating">4.8</b>
            </span>

        </div>


        <div class="details-buttons">

            <a
                id="startReading"
                class="read-button"
            >
                📖 Start Reading
            </a>


            <button onclick="bookmarkStory()">
                🔖 Bookmark
            </button>

        </div>

    </div>

</section>


<section class="section">

    <h2>
        Chapters
    </h2>


    <div id="chapterList"></div>

</section>

</main>


<script src="script.js"></script>

</body>

</html>
